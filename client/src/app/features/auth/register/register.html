<div class="auth-page">
<div class="container">
  <div class="card auth-card auth-card--wide">
    <h1 class="auth-title">{{ t.registerTitle }}</h1>

    <form (ngSubmit)="submit()">
      <div class="field">
        <label for="companyName">{{ t.companyName }}</label>
        <div class="field__control">
          <app-icon name="building" />
          <input
            id="companyName"
            type="text"
            name="companyName"
            [(ngModel)]="companyName"
            autocomplete="organization"
            required
          />
        </div>
      </div>
      <fieldset class="address-group">
        <legend><app-icon name="map-pin" />{{ t.billingAddress }}</legend>
        <p class="muted">{{ t.billingAddressHint }}</p>
        <app-address-fields idPrefix="register-address" [compact]="true" [draft]="address" [readOnly]="busy()" />
      </fieldset>
      <div class="field">
        <label for="email">{{ t.email }}</label>
        <div class="field__control">
          <app-icon name="mail" />
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            autocomplete="email"
            required
          />
        </div>
      </div>
      <div class="field">
        <label for="password">{{ t.password }}</label>
        <div class="field__control">
          <app-icon name="lock" />
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            autocomplete="new-password"
            required
          />
        </div>
      </div>

      @if (error(); as message) {
        <p class="alert alert--error" role="alert"><app-icon name="alert-circle" />{{ message }}</p>
      }

      <button type="submit" class="btn btn--primary" [disabled]="busy()">
        <app-icon name="user-plus" />
        {{ t.submitRegister }}
      </button>
    </form>

    <p class="auth-switch" data-testid="privacy-link">
      {{ privacy.registerLink }} <a routerLink="/privacidade">{{ privacy.link }}</a>.
    </p>

    <p class="auth-switch">
      {{ t.haveAccount }} <a routerLink="/login">{{ t.goToLogin }}</a>
    </p>
  </div>
</div>
</div>
