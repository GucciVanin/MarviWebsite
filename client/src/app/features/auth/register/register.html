<div class="container page">
  <div class="card auth-card">
    <h1 class="auth-title">{{ t.registerTitle }}</h1>

    <form (ngSubmit)="submit()">
      <div class="field">
        <label for="companyName">{{ t.companyName }}</label>
        <input
          id="companyName"
          type="text"
          name="companyName"
          [(ngModel)]="companyName"
          autocomplete="organization"
          required
        />
      </div>
      <div class="field">
        <label for="billingAddress">{{ t.billingAddress }}</label>
        <input
          id="billingAddress"
          type="text"
          name="billingAddress"
          [(ngModel)]="billingAddress"
          autocomplete="street-address"
          required
        />
      </div>
      <div class="field">
        <label for="email">{{ t.email }}</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          autocomplete="email"
          required
        />
      </div>
      <div class="field">
        <label for="password">{{ t.password }}</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="new-password"
          required
        />
      </div>

      @if (error(); as message) {
        <p class="alert alert--error" role="alert">{{ message }}</p>
      }

      <button type="submit" class="btn btn--primary" [disabled]="busy()">
        {{ t.submitRegister }}
      </button>
    </form>

    <p class="auth-switch">
      {{ t.haveAccount }} <a routerLink="/login">{{ t.goToLogin }}</a>
    </p>
  </div>
</div>
