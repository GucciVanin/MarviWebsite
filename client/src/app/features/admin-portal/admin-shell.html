<div class="container page stack">
  <h1>{{ t.label }}</h1>
  <nav class="tabs" [attr.aria-label]="t.label">
    <a routerLink="/admin" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" [attr.aria-label]="waitingLabel()">
      {{ t.inbox }}
      @if (waiting(); as count) {
        <span class="badge badge--bad" data-testid="inbox-count">{{ count }}</span>
      }
    </a>
    <a routerLink="/admin/visao-geral" routerLinkActive="is-active">{{ t.overview }}</a>
    <a routerLink="/admin/catalogo" routerLinkActive="is-active">{{ t.catalog }}</a>
    <a routerLink="/admin/precos" routerLinkActive="is-active">{{ t.prices }}</a>
    <a routerLink="/admin/operacao" routerLinkActive="is-active">{{ t.operations }}</a>
    <a routerLink="/admin/clientes" routerLinkActive="is-active">{{ t.customers }}</a>
    <a routerLink="/admin/importacao" routerLinkActive="is-active">{{ t.import }}</a>
    <a routerLink="/admin/auditoria" routerLinkActive="is-active">{{ t.audit }}</a>
  </nav>
  <router-outlet />
</div>
