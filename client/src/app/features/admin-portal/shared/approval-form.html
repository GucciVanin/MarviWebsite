<form class="toolbar" (ngSubmit)="confirm()">
  <div class="field">
    <label for="approve-tier">{{ t.approveTier }}</label>
    <select id="approve-tier" name="approve-tier" [ngModel]="chosen()" (ngModelChange)="chosen.set($event)">
      <option value="">{{ t.approveChoose }}</option>
      @for (tier of tiers(); track tier.id) {
        <option [value]="tier.id">{{ tier.name }}</option>
      }
    </select>
  </div>
  <button type="submit" class="btn btn--primary btn--small" [disabled]="!canConfirm()">{{ t.confirmApprove }}</button>
  <button type="button" class="btn btn--outline btn--small" (click)="cancelled.emit()">{{ t.cancel }}</button>
</form>
