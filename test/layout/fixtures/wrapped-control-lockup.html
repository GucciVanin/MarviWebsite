<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="layout-expect" content="wrapped-control">
<title>Wrapped: a lockup whose tagline breaks</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:16px/1.5 Arial,Helvetica,sans-serif;color:#111}
.page{padding:16px;max-width:960px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;width:150px;color:inherit;text-decoration:none}
.badge{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#123;color:#fff}
.text{display:grid;min-width:0;line-height:1.1}
.tag{font-size:11px}
</style></head><body><main class="page">
<header><a class="brand" data-lockup href="#"><span class="badge" aria-hidden="true">M</span><span class="text"><span>MARVI</span><span class="tag">Exímia Distribuidora de Bebidas</span></span></a></header>
</main></body></html>
