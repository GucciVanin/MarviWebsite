<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="layout-expect" content="none">
<title>Clean</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:16px/1.5 Arial,Helvetica,sans-serif;color:#111}
.page{padding:16px;max-width:960px;margin:0 auto}
input,select{font:inherit;height:40px;padding:0 8px;width:100%}
label{display:block}
.btn{display:inline-flex;align-items:center;white-space:nowrap;height:40px;padding:0 16px;border:1px solid #333;background:#eee;font:inherit}

nav{display:flex;gap:8px;flex-wrap:wrap}
nav a{display:inline-flex;align-items:center;white-space:nowrap;height:40px;padding:0 12px}
.scroll{overflow-x:auto}.scroll table{min-width:900px;border-collapse:collapse}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{border:1px solid #ccc;padding:16px;border-radius:8px}
.row{display:flex;flex-wrap:wrap;gap:16px}.row>.field{flex:1 1 200px;min-width:0}
.field{margin-bottom:12px}

</style></head><body><main class="page">
<header><nav><a href="#a">Início</a><a href="#b">Nossa Rede</a><a href="#c">Por que a Marvi</a><a href="#d">Painel do funcionário</a></nav></header>
<section>
<h1>Página limpa</h1>
<p>Texto de parágrafo alinhado ao contêiner.</p>
<form>
<div class="field"><label for="n">Nome</label><input id="n" type="text"></div>
<div class="row"><div class="field"><label for="a">Cidade</label><input id="a" type="text"></div><div class="field"><label for="b">Estado</label><input id="b" type="text"></div></div>
<div class="field"><label for="m">Mensagem</label><input id="m" type="text"></div>
<button class="btn" type="submit">Enviar</button> <button class="btn" type="button">Cancelar</button>
</form>
<div class="grid"><div class="card"><h3>Um</h3><p>Texto curto.</p></div><div class="card"><h3>Dois</h3><p>Texto curto.</p></div><div class="card"><h3>Três</h3><p>Texto curto.</p></div></div>
<div class="scroll"><table><tr><th>A</th><th>B</th><th>C</th></tr><tr><td>1</td><td>2</td><td>3</td></tr></table></div>
</section>
</main></body></html>
