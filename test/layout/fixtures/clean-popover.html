<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="layout-expect" content="none">
<title>Clean: an open pop-up inside the viewport, clear of the fixed button, over page text on purpose</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:16px/1.5 Arial,Helvetica,sans-serif;color:#111}
.page{padding:16px;max-width:960px;margin:0 auto}
.anchor{position:relative;display:inline-block}
.pop{scroll-margin-top:80px;position:absolute;top:100%;left:0;width:min(26rem,calc(100vw - 1rem));max-height:12rem;overflow-y:auto;border:1px solid #ccc;background:#fff;padding:12px;z-index:5}
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ccc;padding:8px 16px}
.wa{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:#167a3e;z-index:20}
</style></head><body><header class="top">Marvi</header><main class="page"><h1>Fila</h1><div style="height:60px"></div>
<span class="anchor"><button type="button">Consultar cliente</button>
<div class="pop" data-popover role="dialog" aria-label="Cliente"><h3>Bar do Ze</h3><dl><dt>Situacao</dt><dd>Aprovado</dd></dl></div></span>
<p>Texto que o pop-up cobre de proposito, logo abaixo do botao.</p><p>Mais texto abaixo.</p><div style="height:900px"></div></main><script>addEventListener('load',()=>window.scrollTo(0,70))</script><a class="wa" href="#" aria-label="WhatsApp"></a></body></html>
