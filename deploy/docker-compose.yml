# Secrets come from deploy/.env (untracked). Copy deploy/.env.example to deploy/.env and edit it.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: marvi
      POSTGRES_USER: marvi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - marvi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marvi -d marvi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      # The password goes through PGPASSWORD (read by Npgsql), not into the connection string, so characters such as
      # ; = " in it cannot corrupt or inject connection-string settings.
      ConnectionStrings__AppDb: "Host=postgres;Port=5432;Database=marvi;Username=marvi"
      PGPASSWORD: ${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in deploy/.env}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL in deploy/.env}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in deploy/.env}
      # This compose file is for development and the runtime test suite, which run on the example values of deploy/.env.example.
      # The API image is Production by default and refuses example secrets there (MRV-3.3a); this says, loudly, that here it is fine.
      # A real deployment must NOT set it (see docs/operations.md).
      Deployment__AllowExampleSecrets: "true"
      # Rate limits (MRV-3.3b) are tight by default; development and the runtime suite sign in and register far faster than a person.
      RateLimiting__Auth__PermitLimit: "100000"
      RateLimiting__Coverage__PermitLimit: "100000"
      RateLimiting__Contact__PermitLimit: "100000"
      RateLimiting__Addresses__PermitLimit: "100000"
      # The nginx proxy in front of the API forwards the real client address; trust it (the API is only meant to be reached through it).
      ForwardedHeaders__Enabled: "true"
      # Google reviews on the home page (MRV-2.5); both empty hides the section.
      Reviews__Google__ApiKey: ${GOOGLE_PLACES_API_KEY:-}
      Reviews__Google__PlaceId: ${GOOGLE_PLACE_ID:-}
      Reviews__Google__BaseUrl: ${GOOGLE_PLACES_BASE_URL:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The aspnet image has no curl/wget, so probe /health over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  client:
    build:
      context: ../client
      dockerfile: ../deploy/Dockerfile.client
      additional_contexts:
        deploy: ../deploy
    ports:
      - "4200:4200"
    depends_on:
      api:
        condition: service_healthy

volumes:
  marvi-db-data:
