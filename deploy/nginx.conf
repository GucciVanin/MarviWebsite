server {
    listen 4200;
    server_name _;

    # Security headers (MRV-3.3c). "always" keeps them on error responses too. HSTS is deliberately not set here: it belongs on
    # the HTTPS endpoint in front of this container (docs/operations.md), and sending it over plain http is meaningless.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The product photo upload (MRV-9.7): the only place a request body may reach 6 MB (5 MB file + multipart framing); everywhere else nginx keeps its
    # 1 MB default. The API enforces the same cap and answers the details; this location only has to let it through.
    location = /api/admin/media/product-photos {
        client_max_body_size 6m;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://api:8080/api/admin/media/product-photos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public product photos: the API sends the long cache headers (immutable, one year); the generic /api/ location would add "no-store" on top.
    location ^~ /api/public/media/products/ {
        # No add_header here, so the server-level security headers apply as everywhere (nosniff then appears twice, harmless) and the API's own cache headers pass through untouched.
        proxy_pass http://api:8080/api/public/media/products/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # add_header in a location replaces the server-level ones, so the API responses repeat what they need.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
